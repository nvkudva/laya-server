<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laya · decision playground</title>
<style>
  :root {
    --bg: #0e0f13; --panel: #16181f; --edge: #262a35; --fg: #e6e8ee; --dim: #8b93a7;
    --accent: #6ea8fe; --good: #4ec9a0; --warn: #e5c07b; --bad: #e06c75;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button, input, textarea, select {
    font: inherit; color: inherit; background: var(--panel);
    border: 1px solid var(--edge); border-radius: 6px; padding: 6px 8px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #07111f; border-color: var(--accent); font-weight: 600; }
  textarea { resize: vertical; width: 100%; }

  /* ---- left pane: question set editor ---- */
  #editor {
    width: 380px; flex: none; border-right: 1px solid var(--edge);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #editor header, #editor footer { padding: 12px; border-bottom: 1px solid var(--edge); }
  #editor footer { border-bottom: none; border-top: 1px solid var(--edge); }
  #editor h1 { margin: 0 0 8px; font-size: 15px; letter-spacing: .02em; }
  #questions { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .q {
    border: 1px solid var(--edge); border-radius: var(--radius);
    background: var(--panel); padding: 10px; display: flex; flex-direction: column; gap: 6px;
  }
  .q .row { display: flex; gap: 6px; align-items: center; }
  .q .row input[name=name] { flex: 1; font-family: ui-monospace, monospace; }
  .q textarea { min-height: 42px; }
  .q label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .crit { display: flex; gap: 6px; }
  .crit input { flex: 1; }
  .crit input.label { flex: 0 0 34%; font-family: ui-monospace, monospace; }
  .x { flex: none; padding: 4px 8px; color: var(--dim); }
  .x:hover { color: var(--bad); border-color: var(--bad); }
  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ---- right pane: conversation ---- */
  #chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #log { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  #log .empty { color: var(--dim); margin: auto; text-align: center; max-width: 380px; }
  .turn { display: flex; flex-direction: column; gap: 12px; max-width: 760px; width: 100%; align-self: center; }
  .state {
    align-self: flex-end; max-width: 80%; background: #1e2a3d; border: 1px solid #2c3d59;
    padding: 10px 14px; border-radius: var(--radius); white-space: pre-wrap;
  }
  .answers { display: flex; flex-direction: column; gap: 10px; }
  .card { border: 1px solid var(--edge); border-radius: var(--radius); background: var(--panel); padding: 12px; }
  .card h3 { margin: 0 0 2px; font-size: 13px; font-family: ui-monospace, monospace; }
  .card .instr { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  .badge { float: right; font-size: 11px; color: var(--dim); font-family: ui-monospace, monospace; }

  .bar { display: grid; grid-template-columns: 34% 1fr 52px; gap: 8px; align-items: center; margin-top: 4px; font-size: 12px; }
  .bar .track { height: 8px; background: #20242e; border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); }
  .bar.top .fill { background: var(--good); }
  .bar .pct { text-align: right; color: var(--dim); font-family: ui-monospace, monospace; }
  .bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .gauge { position: relative; height: 10px; background: #20242e; border-radius: 5px; overflow: hidden; margin-top: 6px; }
  .gauge .fill { height: 100%; }
  .scale { position: relative; height: 26px; margin-top: 10px; }
  .scale .tick { position: absolute; top: 12px; transform: translateX(-50%); font-size: 11px; color: var(--dim); }
  .scale .line { position: absolute; top: 4px; left: 0; right: 0; height: 4px; background: #20242e; border-radius: 2px; }
  .scale .marker { position: absolute; top: 0; width: 2px; height: 12px; background: var(--good); transform: translateX(-50%); }
  .legend { font-size: 12px; color: var(--dim); margin-top: 14px; }

  .err { border-color: var(--bad); }
  .err h3 { color: var(--bad); }
  .err code { font-family: ui-monospace, monospace; color: var(--warn); }
  .meta { font-size: 11px; color: var(--dim); font-family: ui-monospace, monospace; }
  .meta .warn { color: var(--warn); }

  #composer { border-top: 1px solid var(--edge); padding: 12px 24px; display: flex; gap: 10px; align-items: flex-end; }
  #composer textarea { min-height: 56px; }
  #composer .side { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
</style>
</head>
<body>

<aside id="editor">
  <header>
    <h1>Question set</h1>
    <div class="toolbar">
      <select id="preset"><option value="">preset…</option></select>
      <button id="add-noul">+ noul</button>
      <button id="add-choice">+ choice</button>
      <button id="add-score">+ score</button>
    </div>
  </header>
  <div id="questions"></div>
  <footer class="toolbar">
    <button id="clear-log">Clear conversation</button>
  </footer>
</aside>

<main id="chat">
  <div id="log"></div>
  <form id="composer">
    <textarea id="state" placeholder="The state to judge — a customer message, a prompt, an email…&#10;⌘/Ctrl+Enter to send"></textarea>
    <div class="side">
      <button class="primary" type="submit" id="send">Ask</button>
    </div>
  </form>
</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
};
const store = {
  get(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---- question set editor -------------------------------------------------

const DEFAULT_SET = [
  { name: "intent", type: "choice", instructions: "What does the customer want?",
    criteria: [["refund", "money returned or a duplicate charge reversed"],
               ["technical_help", "a bug, outage or integration problem"],
               ["other", "none of the other options fits"]] },
  { name: "urgency", type: "score", instructions: "How urgent is this message?",
    criteria: ["Can wait", "Needs attention this week", "Needs attention today"] },
  { name: "is_frustrated", type: "noul", instructions: "Does the customer sound frustrated?", criteria: [] },
];

let questions = store.get("laya.questions", DEFAULT_SET);

function blankFor(type) {
  return {
    name: "", type, instructions: "",
    criteria: type === "choice" ? [["", ""]] : type === "score" ? ["", "", ""] : [],
  };
}

function renderEditor() {
  const host = $("#questions");
  host.replaceChildren(...questions.map((q, i) => {
    const save = () => store.set("laya.questions", questions);
    const head = el("div", { class: "row" },
      el("input", { name: "name", placeholder: "question_name", value: q.name,
        oninput: (e) => { q.name = e.target.value; save(); } }),
      el("span", { class: "meta" }, q.type),
      el("button", { class: "x", type: "button",
        onclick: () => { questions.splice(i, 1); save(); renderEditor(); } }, "✕"));

    const instr = el("textarea", { placeholder: "instructions" });
    instr.value = q.instructions;
    instr.addEventListener("input", (e) => { q.instructions = e.target.value; save(); });

    const parts = [head, instr];

    if (q.type === "choice") {
      parts.push(el("label", {}, "criteria — label : description"));
      q.criteria.forEach((pair, j) => {
        parts.push(el("div", { class: "crit" },
          el("input", { class: "label", placeholder: "label", value: pair[0],
            oninput: (e) => { pair[0] = e.target.value; save(); } }),
          el("input", { placeholder: "description (optional)", value: pair[1] ?? "",
            oninput: (e) => { pair[1] = e.target.value; save(); } }),
          el("button", { class: "x", type: "button",
            onclick: () => { q.criteria.splice(j, 1); save(); renderEditor(); } }, "✕")));
      });
      parts.push(el("button", { type: "button",
        onclick: () => { q.criteria.push(["", ""]); save(); renderEditor(); } }, "+ option"));
    } else if (q.type === "score") {
      parts.push(el("label", {}, "criteria — lowest rung first"));
      q.criteria.forEach((rung, j) => {
        parts.push(el("div", { class: "crit" },
          el("input", { placeholder: `rung ${j}`, value: rung,
            oninput: (e) => { q.criteria[j] = e.target.value; save(); } }),
          el("button", { class: "x", type: "button",
            onclick: () => { q.criteria.splice(j, 1); save(); renderEditor(); } }, "✕")));
      });
      parts.push(el("button", { type: "button",
        onclick: () => { q.criteria.push(""); save(); renderEditor(); } }, "+ rung"));
    } else {
      parts.push(el("label", {}, "criteria (optional)"));
      const [t, f] = [q.criteria[0] ?? "", q.criteria[1] ?? ""];
      parts.push(el("div", { class: "crit" },
        el("input", { class: "label", value: "true", disabled: "" }),
        el("input", { placeholder: "what makes it true", value: t,
          oninput: (e) => { q.criteria[0] = e.target.value; save(); } })));
      parts.push(el("div", { class: "crit" },
        el("input", { class: "label", value: "false", disabled: "" }),
        el("input", { placeholder: "what makes it false", value: f,
          oninput: (e) => { q.criteria[1] = e.target.value; save(); } })));
    }
    return el("div", { class: "q" }, parts);
  }));
}

/** Editor rows → the Jev `questions` object. Throws on user error. */
function buildQuestions() {
  const out = {};
  for (const [i, q] of questions.entries()) {
    const name = q.name.trim();
    const touched = q.instructions.trim() || q.criteria.flat().some((c) => (c ?? "").trim());
    if (!name && !touched) continue;
    if (!name) throw new Error(`Question ${i + 1} (${q.type}) needs a name.`);
    if (name in out) throw new Error(`Duplicate question name '${name}'.`);
    const body = { type: q.type };
    if (q.instructions.trim()) body.instructions = q.instructions.trim();
    if (q.type === "choice") {
      const criteria = {};
      for (const [label, desc] of q.criteria) {
        const l = label.trim();
        if (!l) continue;
        criteria[l] = desc.trim() || null;
      }
      if (Object.keys(criteria).length < 2) throw new Error(`'${name}' needs at least two labelled options.`);
      body.criteria = criteria;
    } else if (q.type === "score") {
      const rungs = q.criteria.map((r) => r.trim()).filter(Boolean);
      if (!rungs.length) throw new Error(`'${name}' needs at least one rung.`);
      body.criteria = rungs;
    } else {
      const [t, f] = q.criteria.map((c) => (c ?? "").trim());
      if (t || f) body.criteria = { true: t || null, false: f || null };
    }
    out[name] = body;
  }
  if (!Object.keys(out).length) throw new Error("Add at least one question.");
  return out;
}

/** Server preset (already Jev-shaped) → editor rows. */
function adoptPreset(set) {
  questions = Object.entries(set).map(([name, q]) => ({
    name, type: q.type, instructions: q.instructions ?? "",
    criteria: q.type === "choice" ? Object.entries(q.criteria).map(([l, d]) => [l, d ?? ""])
      : q.type === "score" ? q.criteria.slice()
      : [q.criteria?.true ?? "", q.criteria?.false ?? ""],
  }));
  store.set("laya.questions", questions);
  renderEditor();
}

// ---- rendering answers ---------------------------------------------------

const pct = (p) => `${(p * 100).toFixed(1)}%`;
const lerp = (p) => `hsl(${(1 - p) * 140} 60% 50%)`;

function cardHead(name, q, confidence) {
  return [
    confidence == null ? null : el("span", { class: "badge" }, `confidence ${confidence.toFixed(3)}`),
    el("h3", {}, name),
    q?.instructions ? el("div", { class: "instr" }, q.instructions) : null,
  ];
}

function renderChoice(name, q, a) {
  const entries = Object.entries(a.probabilities ?? {}).sort((x, y) => y[1] - x[1]);
  return el("div", { class: "card" },
    cardHead(name, q, a.confidence),
    entries.map(([label, p], i) =>
      el("div", { class: i === 0 ? "bar top" : "bar" },
        el("span", { class: "lbl", title: label }, label),
        el("span", { class: "track" }, el("span", { class: "fill", style: `width:${p * 100}%` })),
        el("span", { class: "pct" }, pct(p)))));
}

function renderScore(name, q, a) {
  const legend = a.legend ?? {};
  const rungs = Object.keys(legend).map(Number).sort((x, y) => x - y);
  const max = Math.max(1, rungs.length - 1);
  return el("div", { class: "card" },
    cardHead(name, q, a.confidence),
    el("div", { class: "meta" }, `score ${a.score?.toFixed(3)} of ${max}`),
    el("div", { class: "scale" },
      el("span", { class: "line" }),
      el("span", { class: "marker", style: `left:${(a.score / max) * 100}%` }),
      rungs.map((r) => el("span", { class: "tick", style: `left:${(r / max) * 100}%` }, String(r)))),
    el("div", { class: "legend" },
      rungs.map((r) => el("div", {}, `${r} — ${legend[r]}`))));
}

function renderNoul(name, q, a) {
  const p = a.noul ?? 0;
  return el("div", { class: "card" },
    cardHead(name, q, a.confidence),
    el("div", { class: "meta" }, `${p >= 0.5 ? "yes" : "no"} · ${pct(p)}`),
    el("div", { class: "gauge" },
      el("span", { class: "fill", style: `width:${p * 100}%; background:${lerp(p)}` })));
}

function renderAnswers(sent, data) {
  const wrap = el("div", { class: "answers" });
  for (const [name, a] of Object.entries(data.answers ?? {})) {
    const q = sent[name];
    const card = a.type === "score" ? renderScore(name, q, a)
      : a.type === "choice" ? renderChoice(name, q, a)
      : renderNoul(name, q, a);
    if (a.action?.act_probability != null) {
      card.append(el("div", { class: "meta" }, `act_probability ${a.action.act_probability.toFixed(3)}`));
    }
    wrap.append(card);
  }
  const tokens = data.usage?.input_tokens;
  wrap.append(el("div", { class: "meta" },
    el("span", {}, `${data.model} · ${tokens} input tokens`),
    tokens >= 450 ? el("span", { class: "warn" }, "  ⚠ near the 512-token limit — content may be silently truncated") : null));
  return wrap;
}

function renderError(detail) {
  return el("div", { class: "card err" },
    el("h3", {}, "Request rejected"),
    (Array.isArray(detail) ? detail : [{ loc: [], msg: String(detail) }]).map((d) =>
      el("div", {}, el("code", {}, (d.loc ?? []).join(".")), ` ${d.msg}`)));
}

// ---- conversation --------------------------------------------------------

const log = $("#log");
let history = store.get("laya.history", []);

function renderTurn(turn) {
  const node = el("div", { class: "turn" },
    el("div", { class: "state" }, turn.state),
    turn.error ? renderError(turn.error) : renderAnswers(turn.sent, turn.data));
  log.append(node);
  log.scrollTop = log.scrollHeight;
}

function renderLog() {
  log.replaceChildren();
  if (!history.length) {
    log.append(el("div", { class: "empty" },
      "Edit the question set on the left, then send a state. " +
      "Laya answers every question in one pass — each turn is independent, it has no memory."));
    return;
  }
  history.forEach(renderTurn);
}

async function ask(state) {
  log.querySelector(".empty")?.remove();
  let sent;
  try {
    sent = buildQuestions();
  } catch (e) {
    return renderTurn({ state, error: e.message });
  }
  const pendingNode = el("div", { class: "turn" },
    el("div", { class: "state" }, state),
    el("div", { class: "meta" }, "thinking…"));
  log.append(pendingNode);
  log.scrollTop = log.scrollHeight;

  let turn;
  try {
    const res = await fetch("/v1/systemone", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ state, model: "laya", questions: sent }),
    });
    const body = await res.json();
    turn = res.ok ? { state, sent, data: body } : { state, sent, error: body.detail };
  } catch (e) {
    turn = { state, sent, error: String(e) };
  }
  pendingNode.remove();
  history.push(turn);
  store.set("laya.history", history.slice(-30));
  renderTurn(turn);
}

// ---- wiring --------------------------------------------------------------

const addQuestion = (type) => {
  questions.push(blankFor(type));
  renderEditor();
  [...document.querySelectorAll('#questions input[name="name"]')].pop()?.focus();
};
$("#add-noul").onclick = () => addQuestion("noul");
$("#add-choice").onclick = () => addQuestion("choice");
$("#add-score").onclick = () => addQuestion("score");
$("#clear-log").onclick = () => { history = []; store.set("laya.history", history); renderLog(); };

$("#composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const box = $("#state");
  const state = box.value.trim();
  if (!state) return;
  box.value = "";
  ask(state);
});
$("#state").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#composer").requestSubmit();
});

renderEditor();
renderLog();

fetch("/ui/presets").then((r) => r.json()).then((presets) => {
  const sel = $("#preset");
  for (const name of Object.keys(presets)) sel.append(el("option", { value: name }, name));
  sel.onchange = () => { if (sel.value) adoptPreset(presets[sel.value]); sel.value = ""; };
}).catch(() => {});
</script>
</body>
</html>
