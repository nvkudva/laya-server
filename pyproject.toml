[project]
name = "laya-server"
version = "0.2.0"
description = "Local Jev / System One HTTP API backed by the Laya decision model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "laya==0.3.4",
    "torch==2.14.0",
    "transformers==5.17.0",
    "huggingface-hub==1.32.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
laya-server = "laya_server.cli:main"

[project.optional-dependencies]
dev = ["typesafe-sdk==0.7.0"]

[tool.uv]
package = true

# PyPI's Linux torch wheel drags in the whole CUDA toolkit (several GB). Default Linux to the
# CPU build; for a GPU box, sync against https://download.pytorch.org/whl/cu130 instead.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["laya_server"]
