[project]
name = "laya-server"
version = "0.1.0"
description = "Local Jev / System One HTTP API backed by the Laya decision model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "laya==0.3.4",
    "torch==2.14.0",
    "transformers==5.17.0",
    "huggingface-hub==1.32.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = ["typesafe-sdk==0.7.0"]

[tool.uv]
package = false
